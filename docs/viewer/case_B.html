<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thermal scene viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e9ecec; --surface: #f8f9f9; --ink: #1d2427; --muted: #5a666b; --line: #cfd5d7;
  --accent: #2b6a88; --accent-ink: #ffffff; --stage: #22272a; --stage-ink: #f2f4f4; --stage-muted: #b4bec2;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121618; --surface: #1a2023; --ink: #e4e9ea; --muted: #8f9ca1; --line: #2c3539;
    --accent: #79b4d1; --accent-ink: #0f1517; --stage: #0d1012; --stage-ink: #eef1f2; --stage-muted: #9aa6ab;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121618; --surface: #1a2023; --ink: #e4e9ea; --muted: #8f9ca1; --line: #2c3539;
  --accent: #79b4d1; --accent-ink: #0f1517; --stage: #0d1012; --stage-ink: #eef1f2; --stage-muted: #9aa6ab;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%; margin: 0; background: var(--bg); color: var(--ink);
  font: 400 14px/1.45 "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
}
.app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
.rail {
  background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto;
  padding: 18px 18px 24px; display: flex; flex-direction: column; gap: 20px;
}
.rail h1 { font: 600 17px/1.25 "Barlow", sans-serif; margin: 0; }
.rail .source { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group > .label { font-weight: 600; font-size: 13px; color: var(--muted); }
.clock { display: flex; align-items: baseline; gap: 10px; }
.clock .hm { font: 600 40px/1 "Barlow Semi Condensed", "Barlow", sans-serif; font-variant-numeric: tabular-nums; letter-spacing: .5px; }
.clock .day { color: var(--muted); font-size: 13.5px; }
.row { display: flex; align-items: center; gap: 8px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
button, select, input[type=number] {
  font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
input[type=number] { width: 72px; cursor: text; }
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg button { text-align: left; }
.views { display: flex; flex-wrap: wrap; gap: 6px; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.hint { color: var(--muted); font-size: 12.5px; }
.stage { position: relative; background: var(--stage); min-height: 0; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.reticle { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; transform: translate(-50%, -50%); pointer-events: none; }
.reticle::before, .reticle::after { content: ""; position: absolute; background: rgba(255,255,255,.85); }
.reticle::before { left: 12px; top: 0; width: 2px; height: 26px; }
.reticle::after { top: 12px; left: 0; height: 2px; width: 26px; }
.spot {
  position: absolute; left: 16px; top: 14px; color: var(--stage-ink); pointer-events: none;
  text-shadow: 0 1px 2px rgba(0,0,0,.6);
}
.spot .v { font: 600 30px/1 "Barlow Semi Condensed", sans-serif; font-variant-numeric: tabular-nums; }
.spot .n { font-size: 13px; color: var(--stage-muted); margin-top: 4px; max-width: 46ch; }
.scale { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); display: flex; gap: 8px; align-items: stretch; height: min(62%, 420px); color: var(--stage-ink); }
.scale canvas { width: 14px; height: 100%; border-radius: 2px; }
.ticks { display: flex; flex-direction: column; justify-content: space-between; font: 500 13px/1 "Barlow Semi Condensed", sans-serif; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.legend { position: absolute; right: 18px; bottom: 16px; display: none; flex-direction: column; gap: 5px; color: var(--stage-ink); font-size: 12.5px; background: rgba(0,0,0,.35); padding: 10px 12px; border-radius: 6px; }
.legend span { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 7px; vertical-align: -1px; }
.tip {
  position: absolute; pointer-events: none; display: none; max-width: 300px; padding: 9px 11px; border-radius: 6px;
  background: rgba(16,20,22,.92); color: #eef1f2; font-size: 12.5px; line-height: 1.4;
}
.tip b { font-weight: 600; font-size: 13.5px; }
.tip .k { color: #9aa6ab; }
.mode-note { position: absolute; left: 16px; bottom: 14px; color: var(--stage-muted); font-size: 12.5px; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--stage-ink); padding: 24px; text-align: center; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 58vh auto; height: auto; min-height: 100%; }
  .stage { order: -1; height: 58vh; }
  .rail { border-right: 0; border-top: 1px solid var(--line); }
  .scale { right: 10px; height: 52%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Viewer controls">
    <div>
      <h1 id="title">Thermal scene</h1>
      <div class="source" id="source"></div>
    </div>
    <div class="group" aria-label="Time">
      <div class="clock"><span class="hm" id="hm">--:--</span><span class="day" id="day"></span></div>
      <input type="range" id="time" min="0" max="1" step="1" value="0" aria-label="Simulated time">
      <div class="row">
        <button id="play" aria-pressed="false">Play</button>
        <select id="speed" aria-label="Playback speed">
          <option value="1">1 hour per second</option>
          <option value="4" selected>4 hours per second</option>
          <option value="12">12 hours per second</option>
        </select>
      </div>
    </div>
    <div class="group">
      <div class="label">Show</div>
      <div class="seg" role="radiogroup" aria-label="Display">
        <button data-mode="0" class="on" role="radio" aria-checked="true">Camera reading</button>
        <button data-mode="1" role="radio" aria-checked="false">True temperature</button>
        <button data-mode="2" role="radio" aria-checked="false">Where values come from</button>
        <button data-mode="3" role="radio" aria-checked="false">Geometry</button>
      </div>
    </div>
    <div class="group">
      <div class="label">Views</div>
      <div class="views" id="views"></div>
      <div class="hint">Drag to orbit, right-drag or two fingers to pan, scroll to zoom. Hover any surface for its temperatures.</div>
    </div>
    <div class="group">
      <div class="label">Camera settings</div>
      <label for="eps">Emissivity setting <span id="epsv"></span></label>
      <input type="range" id="eps" min="0.5" max="1" step="0.01">
      <div class="row"><label for="rc">Reflected temperature</label><input type="number" id="rc" step="1"> °C</div>
      <label class="check"><input type="checkbox" id="noise" checked> Sensor noise</label>
      <label class="check"><input type="checkbox" id="lock"> Lock colour range</label>
    </div>
    <div class="group">
      <div class="label">Spaces</div>
      <div id="layers" class="group"></div>
    </div>
    <div class="hint" id="about"></div>
  </aside>
  <main class="stage" id="stage">
    <div class="reticle" aria-hidden="true"></div>
    <div class="spot" aria-live="off"><div class="v" id="spotv">–</div><div class="n" id="spotn"></div></div>
    <div class="scale" id="scale"><canvas id="bar" width="14" height="256"></canvas><div class="ticks" id="ticks"></div></div>
    <div class="legend" id="legend"></div>
    <div class="mode-note" id="note"></div>
    <div class="tip" id="tip"></div>
    <div class="err" id="err"></div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  J.forEach((g, i) => { U.uJetA.value[i] = series(g.strength, S.t); U.uJetL.value[i] = series(g.length, S.t); });
  U.uT.value = S.t; U.uSeed.value = S.noise ? (now * 0.37) % 997 : 0;
  if (now - lastRange > 200) { autoRange(); lastRange = now; paintTicks(); }
  if (now - lastSpot > 120) { spot(); lastSpot = now; }
  U.uMin.value = S.min; U.uMax.value = S.max;
  const out = SP.find((s) => s.cls === "Outdoors");
  if (S.mode < 2 && out) { const v = S.mode === 0 ? reading(series(out.bg, S.t), 1, 0) : series(out.bg, S.t);
    const i = Math.round(Math.max(0, Math.min(1, (v - S.min) / (S.max - S.min))) * 255);
    renderer.setClearColor(new THREE.Color(`rgb(${DATA.inferno[3 * i]},${DATA.inferno[3 * i + 1]},${DATA.inferno[3 * i + 2]})`)); }
  else renderer.setClearColor(new THREE.Color(getComputedStyle(stage).backgroundColor));
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
