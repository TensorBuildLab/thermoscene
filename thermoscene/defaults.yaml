# thermoscene defaults. A case configuration overrides any key (deep merge).
# Every quantity below that is not simulated is an assumption; its provenance level is noted.

energyplus:
  executable: null            # or set THERMOSCENE_ENERGYPLUS
  timesteps_per_hour: 4
  run_periods: null           # list of {name, start: "MM-DD", end: "MM-DD", start_day_of_week}
  cache_dir: null             # default <case dir>/.sim_cache; identical prepared models are simulated once

scene:
  zone: null                  # the EnergyPlus zone to build (required)
  plenum: auto                # auto | none | <zone name>: zone above the ceiling that becomes a Plenum space
  interzone_offset_m: 0.005   # coincident interzone faces are pulled apart by this much (avoids z-fighting)
  exterior_skins: true        # outdoor-facing surfaces also get an exterior face (outside-face temperature)
  roof:                       # where rooftop equipment goes; null = no rooftop equipment
    source: none              # none | model (Roof surfaces of the scene) | box
    elevation: null           # box mode
    extent: null              # box mode: [xmin, xmax, ymin, ymax]
    anchor: auto              # shaft position under the AHU discharge: auto (above zone service corner) | [x, y]

# Occupants, luminaires and workstations from the energy model's internal gains (generators/internal_gains.py).
# Counts, presence and powers are simulated; positions are ASSUMED_LAYOUT; surface temperatures HEURISTIC.
internal_gains:
  enabled: true
  seed: 0
  max_occupants: 20             # seated occupants (and workstations) generated at most per zone
  max_luminaires: 60
  monitor_rise_k: 8.0           # monitor housing above air at full plug-load power (HEURISTIC)
  workstation: {desk_m: [1.2, 0.7, 0.74], monitor_m: [0.55, 0.05, 0.35], spacing_m: 2.2, inset_m: 0.9}
  occupant:
    torso_m: [0.40, 0.25, 0.60]   # width, depth, height of the seated torso
    head_m: [0.18, 0.20, 0.24]
    seat_m: 0.45
    chair_offset_m: 0.35          # seat centre beyond the desk edge
    body_area_m2: 1.8             # DuBois area of a standard person (ISO 7730)
    air_velocity_ms: 0.1          # ISO 7730 still air
    default_activity_w: 120.0     # per person when the zone is empty (only used for the hidden bodies)
  luminaire:
    fixture_w: 40.0               # LED troffer wattage used to count fixtures from the lighting power (ENGINEERING_RULE)
    size_m: [0.6, 1.2]
    depth_m: 0.03
    rise_k: 8.0                   # lens above ceiling at full lighting power (HEURISTIC)
    inset_m: 0.6
    min_spacing_m: 1.2
    min_area_per_fixture_m2: 2.0
    clearance_from_air_devices_m: 0.9

faults: []                    # see docs/configuration.md
fault_defaults:               # used for every fault of that type unless the fault sets the key itself
  envelope_defect: {mode: cavity, cavity_resistance: 0.17}    # m2K/W, replaces the highest-resistance layer (ASSUMED)

storage:
  time_series: timesamples    # timesamples (in USD) | sidecar (NPZ next to the USD; for long runs)

# ---------------------------------------------------------------- engineering rules (ENGINEERING_RULE)
sizing:
  air_density: 1.204
  duct_velocity: {main: 6.0, branch: 4.0, rooftop: 7.0}         # m/s
  pipe_velocity: {main: 1.8, branch: 1.2}                        # m/s
  round_ducts_m: [0.10, 0.125, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.60]
  steel_pipe_od_m: [0.0213, 0.0267, 0.0334, 0.0422, 0.0483, 0.0603, 0.0730, 0.0889, 0.1143, 0.1683]
  steel_pipe_id_m: [0.0158, 0.0209, 0.0266, 0.0351, 0.0409, 0.0525, 0.0627, 0.0779, 0.1023, 0.1541]
  diffuser: {size_m: 0.6, max_flow_m3s: 0.15, max_area_m2: 25.0, inset_m: 0.6}
  return_grille: {size_m: 0.6}
  main_duct_flow_fraction: 0.3          # share of the air-loop design flow carried by the floor main at this zone
  return_duct: {flow_fraction: 0.85, max_height_m: 0.5}   # rooftop return duct: share of supply flow, height cap
  coil_face_velocity: 2.5               # m/s, sets AHU cross-section
  min_casing_m: {width: 1.2, height: 0.9}   # smallest catalogue rooftop unit / AHU cross-section
  min_rect_duct_m: 0.15                 # smallest rectangular duct side
  max_rect_duct_aspect: 4.0             # widest rectangular duct = 4 x its height; above that the velocity rises (warned)
  ahu_section_length_m: {OutdoorAirMixer: 1.0, Filter: 0.6, CoolingCoil: 0.8, DXCoolingCoil: 0.8,
                         HeatingCoil: 0.5, HotWaterCoil: 0.5, Fan: 1.6, Discharge: 0.9, Condenser: 1.4}
  chiller_length_m: {base: 1.6, per_kw: 0.02}
  chiller_width_m: 1.2
  chiller_height_m: 1.6

# ---------------------------------------------------------------- layout rules (ASSUMED_LAYOUT)
layout:
  plenum_duct_elevation_frac: 0.6       # duct centre height as a fraction of the plenum depth
  plenum_pipe_clearance_m: 0.1          # pipes run this far below the slab
  main_wall_clearance_m: 0.25
  terminal_offset_from_main_m: 0.6
  roof_clearance_m: 2.0                 # between rooftop units
  roof_curb_m: 0.3
  ceiling_from_roof_max_tilt_deg: 10.0  # zone without a ceiling: diffusers/grilles go on roof surfaces flatter than this

# ---------------------------------------------------------------- materials (emissivity, solar absorptance)
materials:
  fsk_foil:      {emissivity: 0.30, solar_absorptance: 0.20, note: "foil-scrim-kraft duct wrap, dusty"}
  galv_bare:     {emissivity: 0.25, solar_absorptance: 0.60, note: "bare galvanised steel"}
  asj_jacket:    {emissivity: 0.90, solar_absorptance: 0.30, note: "all-service-jacket pipe insulation"}
  alu_jacket:    {emissivity: 0.12, solar_absorptance: 0.25, note: "aluminium jacket, outdoor insulation"}
  brass_valve:   {emissivity: 0.60, solar_absorptance: 0.50, note: "oxidised brass/bronze"}
  copper:        {emissivity: 0.65, solar_absorptance: 0.60, note: "oxidised copper"}
  painted_steel: {emissivity: 0.85, solar_absorptance: 0.50, note: "light grey paint"}
  coil_fins:     {emissivity: 0.85, solar_absorptance: 0.80, note: "finned coil seen as a cavity"}
  roof_membrane: {emissivity: 0.90, solar_absorptance: 0.45, note: "light single-ply membrane"}
  diffuser_face: {emissivity: 0.90, solar_absorptance: 0.30, note: "white powder-coated steel"}
  luminaire_lens: {emissivity: 0.90, solar_absorptance: 0.20, note: "acrylic/polycarbonate diffuser lens"}
  desk:          {emissivity: 0.90, solar_absorptance: 0.50, note: "laminate desk top"}
  monitor:       {emissivity: 0.90, solar_absorptance: 0.80, note: "plastic housing and glass screen"}
  clothing:      {emissivity: 0.95, solar_absorptance: 0.60, note: "textiles"}
  skin:          {emissivity: 0.98, solar_absorptance: 0.60, note: "human skin"}

# element class -> material, by location (plenum / roof)
material_rules:
  plenum: {Duct: fsk_foil, Pipe: asj_jacket, Valve: brass_valve, TerminalBox: galv_bare, CoilSection: galv_bare,
           InsulationDefect: galv_bare, ReturnGrille: galv_bare}
  roof:   {Duct: painted_steel, Pipe: alu_jacket, Valve: brass_valve, EquipmentCasing: painted_steel,
           CondenserCoil: coil_fins, CondenserFan: painted_steel, Motor: painted_steel, Louver: painted_steel,
           RoofSurface: roof_membrane}
  zone:   {Diffuser: diffuser_face, ReturnGrille: diffuser_face}

# ---------------------------------------------------------------- thermal models
thermal:
  band_um: [8.0, 14.0]          # camera band (global: read by thermal/radiometry.py, written to every camera)
  film_coefficients: {inside_air: 20.0, plenum: 8.0, outdoor: 17.0, radiative: 5.0}   # W/m2K   (PHYSICS)
  insulation: {conductivity: 0.040, duct_wrap_m: 0.038, box_lining_m: 0.025, pipe_plenum_m: 0.025, pipe_roof_m: 0.038}
  stagnation_tau_min: {air: 45, water: 120, valve: 30}    # relaxation time of trapped fluid when flow stops (HEURISTIC);
                                                         # rounded lumped-capacitance estimates for a wrapped 200 mm duct, an
                                                         # insulated DN15 pipe and a bare DN15 body (case_studies/benchmark.py)
  provenance_threshold_k: 0.1        # a pixel is labelled by a heuristic overlay (ceiling jet) only where it changes T by >= this
  diffuser: {eta_max: 0.85, flow_exp: 0.25, jet_strength_max: 0.5, jet_len0: 0.15, jet_len1: 0.45}   # (HEURISTIC)
  return_grille_mix: 0.7                                                                # (HEURISTIC)
  casing_coupling: {ahu: 0.05, duct_outdoor: 0.08}                                      # (HEURISTIC)
  compressor_rise_per_plr: 12.0                                                         # K   (HEURISTIC)
  condenser_coil_fraction: 0.6                                                          # of discharge rise (HEURISTIC)
  condenser_air_flow_m3s_per_kw: 0.114                                                  # if not autosized (ENGINEERING_RULE)
  motor_rise: 15.0                                                                      # K   (HEURISTIC)
  bare_pipe_coupling: 0.03          # bare valves/pipes: share of (surroundings - water) at the surface (film ratio)
  louver_sol_air_fraction: 0.3      # louver blades: outdoor air + this share of the sol-air excess (HEURISTIC)
  condenser_air: {density: 1.2, cp: 1005.0}   # kg/m3, J/kgK for the condenser discharge-air rise (PHYSICS)
  sol_air: {vertical_solar_fraction: 0.6, vertical_sky_fraction: 0.5}                   # (HEURISTIC)

camera:
  resolution: [320, 240]
  hfov_deg: 62.0
  emissivity_setting: 0.95
  reflected_setting_c: 20.0
  netd_k: 0.05
  blur_px: 0.7

# ---------------------------------------------------------------- embodied interface (thermoscene.embodied)
# Thermal-camera presets for ThermalCamera.preset(name). Offsets and noise are in K, referred to a 30 degC scene
# (converted to radiance with dL/dT at 30 degC, so their temperature equivalent grows in colder scenes, as in a real
# microbolometer). Resolution, field of view, f-number, NETD, accuracy, output resolution, shutter interval, distortion
# and time constant are datasheet values (docs/sensors.md). Residual non-uniformity, column/row offsets, vignetting and
# drift are not published as numbers; they are assumed magnitudes (HEURISTIC) and are randomised per camera unit.
sensors:
  reference:          # the reference renderer's camera (white noise + Gaussian blur only); reproduces render.raycast
    resolution: [320, 240]
    hfov_deg: 62.0
    netd_k: 0.05
    blur_px: 0.7
    reference_mode: true
  ideal:              # no sensor effects at all (the camera reading differs from the truth only by emissivity/reflection)
    resolution: [320, 240]
    hfov_deg: 62.0
    netd_k: 0.0
    blur_px: 0.0
  lepton35:           # FLIR Lepton 3.5 class (small robots, crawlers); datasheet: Teledyne FLIR Lepton (2025, 2018)
    resolution: [160, 120]
    hfov_deg: 57.0
    netd_k: 0.050               # < 50 mK
    accuracy_k: 5.0             # high gain: greater of +-5 degC or 5 %
    accuracy_frac: 0.05
    pixel_pitch_um: 12.0
    f_number: 1.1
    quant_k: 0.01               # TLinear output, 0.01 K
    fpn_offset_k: 0.04          # residual non-uniformity after correction (HEURISTIC, ~0.8 x NETD)
    fpn_gain: 0.004
    stripe_col_k: 0.03
    stripe_row_k: 0.015
    vignetting_k: 0.4
    drift_k_per_min: 0.15       # offset drift between shutter corrections (HEURISTIC)
    ffc_interval_s: 180         # automatic flat-field correction every 3 min
    dead_pixel_fraction: 0.00005   # typically one defective pixel
    distortion_k1: -0.08        # barrel, about -12 % at the image corner (datasheet: < 13 %)
    time_constant_ms: 12.0
    supersample: 3
  handheld_320:       # 320 x 240 inspection camera class (FLIR E8-XT), handheld or on a ground robot
    resolution: [320, 240]
    hfov_deg: 45.0              # 45 x 34 deg
    netd_k: 0.050               # < 50 mK
    accuracy_k: 2.0             # +-2 degC or +-2 % of reading
    accuracy_frac: 0.02
    pixel_pitch_um: 17.0
    f_number: 1.5
    quant_k: 0.01
    fpn_offset_k: 0.03
    fpn_gain: 0.003
    stripe_col_k: 0.02
    stripe_row_k: 0.01
    vignetting_k: 0.3
    drift_k_per_min: 0.10
    ffc_interval_s: 180
    dead_pixel_fraction: 0.0002
    distortion_k1: -0.02
    time_constant_ms: 10.0
    supersample: 3
  drone_640:          # 640 x 512 drone payload class (DJI Mavic 3T: 12 um, f/1.0, diagonal FOV 61 deg)
    resolution: [640, 512]
    hfov_deg: 49.4              # horizontal field of view from the 61 deg diagonal at 5:4
    netd_k: 0.050               # <= 50 mK at f/1.0
    accuracy_k: 2.0             # high gain: +-2 degC or +-2 %
    accuracy_frac: 0.02
    pixel_pitch_um: 12.0
    f_number: 1.0
    quant_k: 0.01
    fpn_offset_k: 0.03
    fpn_gain: 0.003
    stripe_col_k: 0.02
    stripe_row_k: 0.01
    vignetting_k: 0.3
    drift_k_per_min: 0.10
    ffc_interval_s: 300
    dead_pixel_fraction: 0.0002
    distortion_k1: -0.03
    time_constant_ms: 8.0
    supersample: 2
  defaults:           # values every preset inherits unless it sets them
    emissivity_setting: 0.95
    reflected_setting_c: 20.0
    accuracy_k: 0.0
    accuracy_frac: 0.0
    pixel_pitch_um: 12.0
    f_number: 1.0
    lens_blur_px: 0.45          # aberration/defocus, added in quadrature to the diffraction blur (HEURISTIC)
    quant_k: 0.0
    fpn_offset_k: 0.0
    fpn_gain: 0.0
    stripe_col_k: 0.0
    stripe_row_k: 0.0
    vignetting_k: 0.0
    drift_k_per_min: 0.0
    drift_vignetting_share: 0.3   # share of the drift that has the radial shape of the vignetting (HEURISTIC)
    ffc_interval_s: 0
    dead_pixel_fraction: 0.0
    dead_pixel_range_c: [-20.0, 80.0]
    distortion_k1: 0.0
    distortion_k2: 0.0
    time_constant_ms: 0.0
    supersample: 1
    reference_mode: false
    band_center_um: 10.0
  randomize:          # domain-randomisation ranges (uniform) used by ThermalCamera.randomized(); multipliers of the preset
    netd_k: [0.6, 1.6]
    fpn_offset_k: [0.5, 2.0]
    fpn_gain: [0.5, 2.0]
    stripe_col_k: [0.3, 2.0]
    stripe_row_k: [0.3, 2.0]
    vignetting_k: [0.0, 2.0]
    drift_k_per_min: [0.0, 2.0]
    lens_blur_px: [0.6, 1.6]
    emissivity_setting: [0.90, 1.00]       # absolute values (the operator's setting)
    reflected_setting_c: [10.0, 30.0]      # absolute values

# Scene realism applied when an embodied renderer observes the scene (thermoscene.embodied.world).
realism:
  angular_emissivity: true      # directional emissivity eps(theta) = eps_n * (1 - (1 - cos theta)^5) (HEURISTIC, Schlick)
  specular_reflections: true    # one specular bounce on materials with specularity > 0 (PHYSICS with HEURISTIC specularity)
  texture:                      # world-space value noise: emissivity and temperature variation within a surface (ASSUMED)
    enabled: true
    correlation_m: 0.25
    temperature_k: 0.15         # standard deviation of the within-surface temperature variation
    emissivity: 0.02            # standard deviation of the emissivity variation (multiplied per material, below)
  min_specular_weight: 0.02    # trace a specular bounce only where (1 - eps) * specularity reaches this
  atmosphere_extinction_per_m: 0.0001     # LWIR path transmittance exp(-beta d) toward the air temperature (HEURISTIC)
  specularity:                  # share of the reflected radiance that is specular (the rest is diffuse, at the space MRT)
    fsk_foil: 0.6
    galv_bare: 0.5
    alu_jacket: 0.7
    brass_valve: 0.2
    copper: 0.3
    painted_steel: 0.05
    coil_fins: 0.0
    roof_membrane: 0.05
    diffuser_face: 0.05
    asj_jacket: 0.05
    glazing: 0.9
    surface: 0.05               # opaque EnergyPlus surfaces (paints, gypsum, masonry)
  texture_emissivity_scale:     # multiplier of texture.emissivity per material (low-e metals vary most: dust, oxidation)
    fsk_foil: 3.0
    galv_bare: 2.5
    alu_jacket: 2.0
    glazing: 0.0

# ---------------------------------------------------------------- auto mode (python -m thermoscene auto; thermoscene/auto.py)
auto:
  weather_dir: WeatherData      # in the EnergyPlus installation: the EPW nearest to the model's Site:Location is used
  fallback_epw: USA_IL_Chicago-OHare.Intl.AP.725300_TMY3.epw    # for a model without Site:Location
  run_periods:                  # as the paper's cases
    - {name: SUMMER, start: "07-15", end: "07-16", start_day_of_week: Wednesday}
    - {name: WINTER, start: "01-14", end: "01-15", start_day_of_week: Wednesday}
  timesteps_per_hour: 4         # only for a model without a Timestep object; otherwise the model's own is kept,
  min_timesteps_per_hour: 4     # raised to at least this (with one step per hour the SQLite file has HVAC sub-steps only)
  storage: sidecar              # time series storage of auto scenes
  name_chars: [32, 24]          # scene name = first characters of the model file name + of the zone name (path length)
  frames: ["WINTER 08:00", "SUMMER 15:00"]       # preview frames of every automatic camera
  cameras:                      # targets: zone diffuser > window > largest wall; plenum terminal box > duct; largest rooftop element
    zone:     {name: ZoneCamera, auto: {height: 1.4}, max_height_frac: 0.8, relax: [{min_distance: 0.6, inset: 0.1}]}
    plenum:   {name: PlenumCamera, hfov_deg: 75.0, auto: {min_distance: 1.5}, relax: [{min_distance: 0.5, inset: 0.1}]}
    outdoors: {name: RooftopCamera, auto: {distance: 8.0, height: 4.0}, distance_per_size: 2.0, relax: [{height: 8.0}]}
